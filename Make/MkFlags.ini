NG = 4
REPR = REPR_FUNDAMENTAL
GAUGE_GROUP = GAUGE_SUN
MACRO += BC_T_PERIODIC
MACRO += BC_X_PERIODIC
MACRO += BC_Y_PERIODIC
MACRO += BC_Z_PERIODIC
MACRO += UPDATE_EO
MACRO += CHECK_SPINOR_MATCHING
MACRO += IO_FLUSH
MACRO += WITH_MPI
ENV =
CC = gcc
MPICC = mpicc
CXX = mpicxx
CFLAGS = -Wall -O2 -g
NVCC = nvcc
GPUFLAGS =
# Quenched SU(4) build (QuenchedSU4_claude/quenched_su4_glueball_impl_plan_claude.md, Chunk 2).
# No Grid. HDF5 C library for PureGauge/suN_glueballs_h5_claude (one h5 file per stream).
# NO double quotes or backslashes anywhere in this file (Make/Utils/cinfo.sh embeds it in a C string).
INCLUDE = -I/mnt/hdd_barracuda/opt/myhdfstuff/hdf5-2.1.0/include
LDFLAGS = -L/mnt/hdd_barracuda/opt/myhdfstuff/hdf5-2.1.0/lib -Wl,-rpath,/mnt/hdd_barracuda/opt/myhdfstuff/hdf5-2.1.0/lib -lhdf5
