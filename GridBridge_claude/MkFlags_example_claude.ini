# Example HiRep build configuration for the Grid-in-HiRep bridge (template). Copy it outside or
# next to this file (e.g. GridBridge_claude/MkFlags_mymachine_claude.ini), fill in the two
# machine-specific lines marked FILL IN, and build with
#   MKFLAGS=/path/to/that/file GRID_BUILD=/path/to/grid/build bash GridBridge_claude/build_grid_hirep_claude.sh
# (the script stages it into Make/MkFlags_claude.ini -> Make/MkFlags.ini).
# GridBridge_claude/MkFlags_claude.ini as committed is the PI's machine; do not copy its paths.
#
# NG must equal the Nc Grid was configured with (--enable-Nc=2); the build script aborts otherwise.
NG = 2
REPR = REPR_FUNDAMENTAL
GAUGE_GROUP = GAUGE_SUN
MACRO += BC_T_PERIODIC
MACRO += BC_X_PERIODIC
MACRO += BC_Y_PERIODIC
MACRO += BC_Z_PERIODIC
MACRO += UPDATE_EO
MACRO += CHECK_SPINOR_MATCHING
MACRO += IO_FLUSH
MACRO += WITH_MPI
# NDEBUG must NOT be set: the drivers assert HiRep plaquette == Grid plaquette every trajectory.
ENV =
CC = gcc
MPICC = mpicc
# C++ MPI wrapper: also the LINKER of the Grid executables (build_claude.pl sets LINK = $CXX),
# so MPI libraries come in through it.
CXX = mpicxx
CFLAGS = -Wall -O2 -g
NVCC = nvcc
GPUFLAGS =
#
# FILL IN (1): HDF5 C headers, needed by PureGauge/hmc_glueballs_grid_hdf5_claude.c.
# On a module cluster, e.g. after `module load hdf5`:  INCLUDE = -I$HDF5_DIR/include  (write the
# expanded path; this file is not a shell script).
INCLUDE = -I/path/to/hdf5/include
LDFLAGS =
#
# FILL IN (2): Grid link line. Generate it from YOUR Grid build, with the captured library dir
# FIRST so -lGrid resolves to HiRep/GridLibrary/libGrid.a (copied there by the build script):
#
#   cd /path/to/HiRep
#   echo "GRIDLIBS = -L$PWD/GridLibrary $($GRID_BUILD/grid-config --ldflags) $($GRID_BUILD/grid-config --libs) -fopenmp"
#
# and paste the printed line below. Do not copy the PI's line: it contains -lmpi_cxx (OpenMPI 4 C++
# bindings, absent in OpenMPI 5 and other MPIs) and machine paths.
GRIDLIBS = -L/path/to/HiRep/GridLibrary -L/path/to/deps/lib -lGrid -lhdf5_cpp -lhdf5 -lz -lcrypto -llime -lfftw3f -lfftw3 -lmpfr -lgmp -lstdc++ -lm -fopenmp
