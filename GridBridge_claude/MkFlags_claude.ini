NG = 2
REPR = REPR_FUNDAMENTAL
GAUGE_GROUP = GAUGE_SUN
MACRO += BC_T_PERIODIC
MACRO += BC_X_PERIODIC
MACRO += BC_Y_PERIODIC
MACRO += BC_Z_PERIODIC
MACRO += UPDATE_EO
MACRO += CHECK_SPINOR_MATCHING
MACRO += IO_FLUSH
MACRO += WITH_MPI
ENV =
CC = gcc
MPICC = mpicc
CXX = mpicxx
CFLAGS = -Wall -O2 -g
NVCC = nvcc
GPUFLAGS =
INCLUDE = -I/mnt/hdd_barracuda/opt/myhdfstuff/hdf5-2.1.0/include
LDFLAGS =
# Grid link flags, written out explicitly from grid-config (--ldflags + --libs), with the
# Grid -L redirected to the CAPTURED libGrid.a in HiRep/GridLibrary (see
# build_grid_hirep_claude.sh step 3 and HiRep/GridLibrary/grid_flags_claude.txt). Keeping
# these authoritative here avoids the ad-hoc flag edits that caused ABI skew. -L for the
# captured dir is FIRST so -lGrid resolves to HiRep/GridLibrary/libGrid.a, not grid_mpi.
GRIDLIBS = -L/mnt/baracuda_14/hirep_workspace/HiRep/GridLibrary -L/mnt/hdd_barracuda/opt/openmpi_cuda/lib -Wl,-rpath -Wl,/mnt/hdd_barracuda/opt/openmpi_cuda/lib -Wl,--enable-new-dtags -L/lib -L/usr/local/lib -L/opt/openssl/lib -L/mnt/hdd_barracuda/opt/myhdfstuff/hdf5-2.1.0/lib -lGrid -lmpi_cxx -lmpi -lhdf5_cpp -lhdf5 -lz -lcrypto -llime -lfftw3f -lfftw3 -lmpfr -lgmp -lstdc++ -lm -fopenmp
